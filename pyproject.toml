[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feimini"
version = "0.1.0"
description = "CPU-first research into learned search, typed intermediate representations, and independently verified computation"
readme = "README.md"
authors = [
    { name = "MiniXok", email = "xokmini@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://minixok.pages.dev"
Repository = "https://github.com/MiniXok/Fei-Mini"

[project.scripts]
feimini = "feimini.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
