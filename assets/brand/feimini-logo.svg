<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a3"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="logoSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00e5a3"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="180" rx="24" fill="url(#logoBg)"/>
  <rect width="758" height="178" x="1" y="1" rx="23" fill="none" stroke="#1e2638" stroke-width="1.5"/>

  <!-- Icon Section (x: 35, y: 30, w: 120, h: 120) -->
  <g transform="translate(40, 25)">
    <!-- Left Block -->
    <path d="M30 45 L58 28 L58 102 L30 85 Z" fill="url(#logoCyan)" fill-opacity="0.9"/>
    <!-- Right Block -->
    <path d="M100 45 L72 28 L72 102 L100 85 Z" fill="url(#logoEmerald)" fill-opacity="0.9"/>
    <!-- Center Axis -->
    <rect x="63" y="12" width="4" height="106" rx="2" fill="url(#logoSpine)"/>
    <!-- Nodes -->
    <circle cx="65" cy="28" r="5" fill="#0a0d14" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="65" cy="65" r="6" fill="#0a0d14" stroke="#00e5a3" stroke-width="2"/>
    <circle cx="65" cy="102" r="5" fill="#0a0d14" stroke="#38ef7d" stroke-width="2"/>
  </g>

  <!-- Divider Line -->
  <line x1="190" y1="40" x2="190" y2="140" stroke="#253248" stroke-width="1.5"/>

  <!-- Wordmark Section -->
  <text x="220" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="3" fill="#ffffff">FEI-MINI</text>
  <rect x="520" y="58" width="60" height="24" rx="6" fill="#00e5a3" fill-opacity="0.15" stroke="#00e5a3" stroke-width="1"/>
  <text x="550" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00e5a3" text-anchor="middle">v0.1.0</text>

  <!-- Tagline / Subtitle -->
  <text x="222" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#7d8ca3">VERIFIED COMPUTATION &amp; LOCAL SQLITE AI • MINIXOK</text>
</svg>
