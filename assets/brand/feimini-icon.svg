<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5a3"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00e5a3"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1f293d" stroke-width="2"/>

  <!-- Subtle Inner Grid -->
  <path d="M128 64v384M384 64v384M64 128h384M64 384h384" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Left Block (Typed Representation Node) -->
  <path d="M140 180 L236 124 L236 388 L140 332 Z" fill="url(#cyanGrad)" fill-opacity="0.9"/>
  <!-- Top Facet Left -->
  <path d="M140 180 L236 124 L200 100 L104 156 Z" fill="#68d8d6" fill-opacity="0.4"/>

  <!-- Right Block (Verified Execution Node) -->
  <path d="M372 180 L276 124 L276 388 L372 332 Z" fill="url(#emeraldGrad)" fill-opacity="0.9"/>
  <!-- Top Facet Right -->
  <path d="M372 180 L276 124 L312 100 L408 156 Z" fill="#00e5a3" fill-opacity="0.4"/>

  <!-- Center Verification Axis (The Spine) -->
  <rect x="250" y="74" width="12" height="364" rx="6" fill="url(#accentLine)" filter="url(#glow)"/>

  <!-- Central Verification Nodes -->
  <circle cx="256" cy="124" r="14" fill="#0a0d14" stroke="#00f2fe" stroke-width="4"/>
  <circle cx="256" cy="256" r="16" fill="#0a0d14" stroke="#00e5a3" stroke-width="4"/>
  <circle cx="256" cy="388" r="14" fill="#0a0d14" stroke="#38ef7d" stroke-width="4"/>
</svg>
